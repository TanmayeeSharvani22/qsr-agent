<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QSR Store Agent — Operator</title>
  <style>
    :root { --bg:#eef1f5; --panel:#f7f9fc; --side:#ffffff; --line:#d9e1ea; --me:#0068b5; --bot:#ffffff; --txt:#1f2933; --muted:#5b6b7c; --ok:#16a34a; --brand:#0068b5; --brand-dark:#004a86; }
    * { box-sizing: border-box; }
    html, body { height:100%; margin:0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--txt); display:flex; flex-direction:column; height:100vh; }
    .topbar { flex:0 0 48px; display:flex; align-items:center; gap:28px; padding:0 20px; color:#fff; background:linear-gradient(90deg, var(--brand-dark), var(--brand)); }
    .topbar .logo { font-size:20px; font-weight:700; letter-spacing:-.02em; }
    .topbar .title { font-size:17px; font-weight:600; }
    .topbar .tag { margin-left:auto; font-size:12px; opacity:.85; }
    .footer { flex:0 0 26px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; background:linear-gradient(90deg, var(--brand-dark), var(--brand)); }
    .app { flex:1; min-height:0; display:grid; grid-template-columns:280px minmax(0, 1fr) 350px; gap:16px; padding:16px 24px; }
    .card { background:var(--side); border:1px solid var(--line); border-radius:6px; box-shadow:0 1px 3px rgba(16, 24, 40, .06); }
    .card-title { margin:0; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--brand); }

    aside { display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; }
    aside .section { margin:0 14px; padding:14px 2px 8px; border-bottom:2px solid var(--brand); display:flex; align-items:center; justify-content:space-between; }
    aside .count { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:1px 8px; font-size:11px; color:var(--txt); }
    #services, #approvals { list-style:none; margin:0; padding:6px 10px; overflow-y:auto; }
    #services { flex:1; }
    #approvals { flex:1 1 auto; min-height:0; overscroll-behavior:contain; scrollbar-gutter:stable; }
    #services li, #approvals li { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; margin-bottom:6px; background:var(--panel); border:1px solid var(--line); font-size:13px; }
    #services li .s-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); flex:0 0 auto; }
    #services li.up .s-dot { background:var(--ok); }
    #services li.down .s-dot { background:#ef4444; }
    #services li .s-name { font-weight:600; }
    #services li .s-meta { margin-left:auto; font-size:11px; color:var(--muted); }
    #services .empty, #approvals .empty { color:var(--muted); background:transparent; border:0; padding:10px 12px; }
    #approvals li { display:block; }
    #approvals li, .weather-state { overflow-wrap:anywhere; }
    .action-arguments { white-space:pre-wrap; font-size:11px; margin:7px 0; }
    .approval-title { font-weight:600; line-height:1.35; }
    .approval-meta { color:var(--muted); font-size:11px; margin-top:5px; }
    .approval-reason { color:var(--txt); font-size:12px; line-height:1.35; margin-top:6px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
    .approval-context { color:var(--muted); font-size:12px; line-height:1.3; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .technical-details { margin-top:12px; font-size:11px; color:var(--muted); }
    .technical-details summary { cursor:pointer; }
    .approval-actions { display:flex; gap:6px; margin-top:8px; }
    .approval-actions button { border:1px solid var(--line); border-radius:6px; padding:5px 9px; cursor:pointer; color:var(--txt); background:transparent; }
    .approval-actions .approve { border-color:var(--ok); }
    .approval-actions .reject { border-color:#ef4444; }
    .approval-status { color:var(--muted); font-size:11px; margin-top:7px; text-transform:uppercase; }
    .weather-state { color:var(--muted); font-size:11px; padding:4px 10px 8px; }
    aside .foot { padding:12px 16px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; display:flex; align-items:center; }
    aside .refresh { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:4px 8px; font-size:11px; cursor:pointer; }
    aside .refresh:hover { border-color:var(--me); color:var(--txt); }

    main { display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; }
    main header { margin:0 18px; padding:14px 2px 8px; border-bottom:2px solid var(--brand); display:flex; align-items:center; gap:10px; }
    main header .sub { color:var(--muted); font-size:12px; margin-left:auto; }
    #chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
    .msg { max-width:760px; padding:10px 14px; border-radius:12px; white-space:pre-wrap; line-height:1.45; font-size:14px; }
    .me { align-self:flex-end; background:var(--me); color:#fff; border-bottom-right-radius:3px; }
    .bot { align-self:flex-start; background:var(--bot); border:1px solid var(--line); border-bottom-left-radius:3px; }
    .bot.err { border-color:#fca5a5; background:#fef2f2; color:#b91c1c; }
    .quick { display:flex; flex-wrap:wrap; gap:8px; padding:0 18px 10px; }
    .quick button { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:20px; padding:6px 12px; font-size:12px; cursor:pointer; }
    .quick button:hover { border-color:var(--me); }
    form { display:flex; gap:10px; padding:14px 18px; border-top:1px solid var(--line); background:var(--panel); }
    #q { flex:1; background:#fff; color:var(--txt); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14px; outline:none; }
    #q:focus { border-color:var(--me); }
    button.send { background:var(--me); color:#fff; border:0; border-radius:10px; padding:0 18px; font-weight:600; cursor:pointer; }
    button.send:disabled { opacity:.5; cursor:not-allowed; }
    .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--muted); border-top-color:transparent; border-radius:50%; animation:s .8s linear infinite; vertical-align:middle; }
    .autonomy-panel { display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; }
    .autonomy-panel header { margin:0 16px; padding:14px 2px 8px; border-bottom:2px solid var(--brand); display:flex; align-items:center; gap:10px; }
    .autonomy-panel .count { margin-left:auto; background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:1px 8px; font-size:11px; color:var(--txt); }
    .autonomy-panel .weather-state { padding:8px 16px 4px; }
    @keyframes s { to { transform:rotate(360deg); } }
    @media (max-width:720px) {
      body { height:auto; }
      .app { grid-template-columns:1fr; padding:12px; }
      aside { max-height:60vh; }
      #approvals { min-height:120px; }
      main { height:70vh; }
      #q { min-width:0; }
    }
    @media (max-width:1050px) { .app { grid-template-columns:220px minmax(0, 1fr) 300px; } }
    @media (max-width:720px) { .app { grid-template-columns:1fr; } aside { display:none; } .autonomy-panel { height:auto; max-height:60vh; } }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="logo">Intel</span>
    <span class="title">QSR Store Agent</span>
    <span class="tag">Hermes · Qwen3 · MCP</span>
  </div>

  <div class="app">
  <aside class="card">
    <div class="section">
      <h2 class="card-title">Connected apps</h2>
      <span class="count" id="count">…</span>
    </div>
    <ul id="services"><li class="empty">Loading…</li></ul>
    <div class="foot">
      <button class="refresh" id="refresh">Refresh</button>
    </div>
  </aside>

  <main class="card">
    <header>
      <h2 class="card-title">Operator Chat</h2>
      <span class="sub" id="status">ready</span>
    </header>

    <div id="chat">
      <div class="bot msg">Hi — I'm your store agent. Ask me about kitchen food safety, kiosk, or order accuracy. I answer from the live MCP services.</div>
    </div>

    <div class="quick" id="quick"></div>

    <form id="form">
      <input id="q" autocomplete="off" placeholder="Ask the store agent…" />
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </main>

  <section class="autonomy-panel card" aria-label="Autonomy decisions">
    <header>
      <h2 class="card-title">Autonomy Decisions</h2>
      <span class="count" id="approval-count">…</span>
    </header>
    <div class="weather-state" id="weather-state">Events: waiting</div>
    <ul id="approvals"><li class="empty">Loading…</li></ul>
  </section>
  </div>

  <div class="footer">&copy; 2026 Intel Corporation</div>

  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('form');
    const q = document.getElementById('q');
    const send = document.getElementById('send');
    const quick = document.getElementById('quick');
    const services = document.getElementById('services');
    const count = document.getElementById('count');
    const status = document.getElementById('status');
    const refresh = document.getElementById('refresh');
    const approvals = document.getElementById('approvals');
    const approvalCount = document.getElementById('approval-count');
    const weatherState = document.getElementById('weather-state');
    let lastAutonomySnapshot = '';

    async function loadServers() {
      services.innerHTML = '<li class="empty">Loading…</li>';
      count.textContent = '…';
      try {
        const res = await fetch('/servers');
        const data = await res.json();
        const list = (data.ok && data.servers) ? data.servers : [];
        count.textContent = list.length;
        if (list.length === 0) {
          services.innerHTML = '<li class="empty">No services connected</li>';
        } else {
          services.innerHTML = '';
          list.forEach(name => {
            const li = document.createElement('li');
            li.dataset.name = name;
            li.innerHTML = '<span class="s-dot"></span><span class="s-name"></span><span class="s-meta"></span>';
            li.querySelector('.s-name').textContent = name;
            services.appendChild(li);
          });
          loadStatus();
        }
      } catch (err) {
        count.textContent = '!';
        services.innerHTML = '<li class="empty">Status unavailable</li>';
      }
    }

    async function loadStatus(force) {
      try {
        const res = await fetch('/status' + (force ? '?force=1' : ''));
        const data = await res.json();
        const svc = (data.ok && data.services) ? data.services : {};
        services.querySelectorAll('li[data-name]').forEach(li => {
          const s = svc[li.dataset.name];
          const meta = li.querySelector('.s-meta');
          if (!s) { li.classList.remove('up', 'down'); if (meta) meta.textContent = ''; return; }
          li.classList.toggle('up', !!s.ok);
          li.classList.toggle('down', !s.ok);
          if (meta) meta.textContent = s.ok ? (s.tools + ' tools') : 'offline';
        });
      } catch (err) { /* leave dots neutral */ }
    }

    async function decide(proposalId, decision) {
      try {
        const res = await fetch('/autonomy/proposals/' + encodeURIComponent(proposalId) + '/' + decision, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: '{}'
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'decision failed');
        loadAutonomy();
      } catch (err) {
        add('bot', 'Autonomy action failed: ' + err, true);
      }
    }

    async function loadAutonomy() {
      try {
        const res = await fetch('/autonomy/status');
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Autonomy unavailable');
        const snapshot = JSON.stringify(data) + (data.queue && data.queue.processing ? ':' + Math.floor(Date.now() / 5000) : '');
        if (snapshot === lastAutonomySnapshot) return;
        const scrollTop = approvals.scrollTop;
        const decisions = data.decisions || [];
        const latest = decisions[0];
        weatherState.textContent = latest
          ? eventLabel(latest.event.event_type) + ' · ' + statusLabel(latest.status)
          : 'Events: waiting';
        const queue = data.queue || {};
        if (queue.processing || queue.queued) {
          weatherState.textContent = (queue.processing ? 'Assessing 1 event' : 'Waiting for assessment') +
            (queue.queued ? ' · ' + queue.queued + ' waiting' : '');
        }
        const priority = status => ['pending', 'processing', 'queued', 'failed', 'executing'].includes(status) ? 0 : 1;
        const list = data.proposals.slice().sort((first, second) => priority(first.status) - priority(second.status)).slice(0, 10);
        approvalCount.textContent = data.ok ? data.pending : '!';
        approvals.innerHTML = '';
        if (list.length === 0 && decisions.length === 0) {
          approvals.innerHTML = '<li class="empty">No decisions yet</li>';
          return;
        }
        list.forEach(proposal => {
          const li = document.createElement('li');
          li.dataset.priority = priority(proposal.status);
          li.dataset.timestamp = Date.parse(proposal.created_at || '') || 0;
          const title = document.createElement('div');
          title.className = 'approval-title';
          title.textContent = actionTitle(proposal);
          li.appendChild(title);
          const evidence = proposal.evidence || {};
          addText(li, 'approval-context', compactEventInfo(
            evidence.event_type, evidence.event_data || {}, evidence
          ));
          if (proposal.status === 'pending') {
            addText(li, 'approval-reason', 'Hermes: ' + (proposal.summary || 'Action proposed for review.'));
          }
          if (proposal.status === 'pending') {
            const actions = document.createElement('div');
            actions.className = 'approval-actions';
            const approve = document.createElement('button');
            approve.className = 'approve';
            approve.textContent = 'Approve';
            approve.onclick = () => decide(proposal.id, 'approve');
            const reject = document.createElement('button');
            reject.className = 'reject';
            reject.textContent = 'Reject';
            reject.onclick = () => decide(proposal.id, 'reject');
            actions.append(approve, reject);
            li.appendChild(actions);
          } else {
            const state = document.createElement('div');
            state.className = 'approval-status';
            state.textContent = statusLabel(proposal.status) + (proposal.result && proposal.result.placeholder ? ' · demo' : '');
            li.appendChild(state);
            if (proposal.result) {
              const result = document.createElement('div');
              result.className = 'approval-reason';
              result.textContent = proposal.status === 'failed'
                ? 'The change was not completed. Review the latest event before trying again.'
                : (proposal.result.message || 'The service confirmed the result.');
              li.appendChild(result);
            }
          }
          approvals.appendChild(li);
        });
        decisions.filter(decision => !decision.proposal_id)
          .sort((first, second) => priority(first.status) - priority(second.status)).slice(0, 5).forEach(decision => {
          const li = document.createElement('li');
          li.dataset.priority = priority(decision.status);
          li.dataset.timestamp = Date.parse(decision.event.occurred_at || '') || 0;
          const title = document.createElement('div');
          title.className = 'approval-title';
          title.textContent = eventLabel(decision.event.event_type);
          const meta = document.createElement('div');
          meta.className = 'approval-meta';
          meta.textContent = statusLabel(decision.status);
          li.append(title, meta);
          addText(li, 'approval-context', compactEventInfo(
            decision.event.event_type, decision.event.data || {}, decision
          ));
          addText(li, 'approval-reason', decision.status === 'failed'
            ? (/timed out/i.test(decision.summary || '')
              ? 'Assessment timed out. No change was made. Submit the event again to retry.'
              : 'This event could not be assessed. No change was made.')
            : (decision.summary ? 'Hermes: ' + decision.summary : (decision.status === 'queued'
              ? 'Waiting for earlier events to finish.' : 'Assessment in progress.')));
          if (decision.status === 'processing' && decision.progress) {
            const progress = decision.progress;
            const elapsed = Math.max(0, Math.floor(Date.now() / 1000 - progress.stage_started_at));
            addText(li, 'approval-meta', 'Assessing · Step ' + progress.round + ' of ' + progress.max_rounds + ' · ' + elapsed + 's');
          }
          approvals.appendChild(li);
        });
        [...approvals.children].sort((first, second) => Number(first.dataset.priority) - Number(second.dataset.priority)
          || Number(second.dataset.timestamp) - Number(first.dataset.timestamp))
          .forEach(item => approvals.appendChild(item));
        approvals.scrollTop = scrollTop;
        lastAutonomySnapshot = snapshot;
      } catch (err) {
        lastAutonomySnapshot = '';
        approvalCount.textContent = '!';
        approvals.innerHTML = '<li class="empty">Autonomy unavailable</li>';
      }
    }

    function readable(value) {
      const text = String(value).replace(/[_.-]+/g, ' ');
      return text.charAt(0).toUpperCase() + text.slice(1);
    }

    function statusLabel(status) {
      return ({pending:'Awaiting your approval', no_action:'No change needed',
        queued:'Waiting to be assessed',
        processing:'Assessing event', executing:'Applying change', executed:'Completed',
        rejected:'Rejected', superseded:'Replaced by a newer recommendation',
        failed:'Needs review'})[status] || readable(status);
    }

    function eventLabel(type) {
      return ({order_mismatch_detected:'Order issue reported', weather_changed:'Weather update',
        local_weather_observation_received:'Weather update', queue_count_changed:'Queue update'})[type]
        || readable(type || 'Store event');
    }

    function addText(parent, className, text) {
      const element = document.createElement('div');
      element.className = className;
      element.textContent = text;
      parent.appendChild(element);
    }

    function eventFacts(parent, type, data, evidence = {}, showHeading = true) {
      if (showHeading) addText(parent, 'approval-reason', eventLabel(type));
      const facts = [];
      if (data.order_id) facts.push('Order ' + data.order_id);
      if (typeof data.is_raining === 'boolean') facts.push(data.is_raining ? 'Rain reported' : 'No rain reported');
      else if (data.condition) facts.push(readable(data.condition));
      if (typeof data.temperature_c === 'number') facts.push(data.temperature_c + ' °C');
      if (typeof data.queue_count === 'number') facts.push(data.queue_count + ' customers in the queue');
      if (facts.length) addText(parent, 'approval-reason', facts.join(' · '));
      const context = (evidence.observations || {})['accuracy.get_order_accuracy_context'] || {};
      const order = (context.recent_orders || []).find(order => order.order_id === data.order_id);
      if (order) {
        const issues = (order.issues || []).map(issue => {
          if (issue.type === 'missing_item') return 'Missing ' + readable(issue.item_id);
          if (issue.type === 'wrong_item') return readable(issue.observed) + ' received instead of ' + readable(issue.expected);
          return readable(issue.type);
        });
        if (issues.length) addText(parent, 'approval-reason', issues.join('. ') + '.');
        if (order.station_id) addText(parent, 'approval-meta', readable(order.station_id));
      }
      const known = new Set(['order_id', 'is_raining', 'condition', 'temperature_c', 'queue_count']);
      friendlyFields(parent, Object.fromEntries(Object.entries(data).filter(([key]) => !known.has(key))));
    }

    function actionTitle(proposal) {
      if (proposal.tool === 'accuracy.request_remake') return 'Remake order ' + proposal.arguments.order_id;
      if (proposal.tool === 'kiosk.change_menu_items' || proposal.tool === 'change_menu_items') {
        const changes = proposal.arguments.changes || [];
        const items = Object.values((proposal.evidence || {}).observations || {}).flatMap(context => (context.menu || {}).items || []);
        const labels = changes.map(change => {
          const item = items.find(item => item.id === change.item_id);
          return item ? item.name : readable(change.item_id);
        });
        const availability = changes.length && changes.every(change => change.available === changes[0].available)
          ? (changes[0].available ? 'Make available: ' : 'Hide: ')
          : 'Update menu: ';
        return availability + labels.join(', ');
      }
      return readable(proposal.tool.split('.').pop());
    }

    function compactEventInfo(type, data, evidence) {
      const facts = [];
      if (data.order_id) {
        facts.push('Order ' + data.order_id);
        const context = (evidence.observations || {})['accuracy.get_order_accuracy_context'] || {};
        const order = (context.recent_orders || []).find(item => item.order_id === data.order_id);
        if (order) {
          const issue = (order.issues || [])[0];
          if (issue && issue.type === 'missing_item') facts.push('Missing ' + readable(issue.item_id));
          else if (issue && issue.type === 'wrong_item') facts.push(readable(issue.observed) + ' instead of ' + readable(issue.expected));
          if (order.station_id) facts.push(readable(order.station_id));
        }
      }
      if (type === 'weather_changed' || type === 'local_weather_observation_received') {
        if (typeof data.is_raining === 'boolean') facts.push(data.is_raining ? 'Rain' : 'No rain');
        else if (data.condition) facts.push(readable(data.condition));
        if (typeof data.temperature_c === 'number') facts.push(data.temperature_c + ' °C');
      }
      if (type === 'queue_count_changed') {
        if (typeof data.queue_count === 'number') facts.push('Queue ' + data.queue_count);
        if (typeof data.previous_queue_count === 'number') facts.push('from ' + data.previous_queue_count);
        if (Array.isArray(data.temporarily_hidden_items) && data.temporarily_hidden_items.length) {
          facts.push('Restricted: ' + data.temporarily_hidden_items.map(readable).join(', '));
        }
      }
      if (!facts.length) {
        Object.entries(data).filter(([, value]) => value === null || ['string', 'number', 'boolean'].includes(typeof value))
          .slice(0, 2).forEach(([key, value]) => facts.push(readable(key) + ' ' + String(value)));
      }
      const simulated = Object.values(evidence.observations || {}).some(context =>
        String(context.source || '').includes('placeholder'));
      if (simulated) facts.push('Demo');
      return facts.join(' · ') || eventLabel(type);
    }

    function actionFacts(parent, proposal) {
      const args = proposal.arguments || {};
      if (proposal.tool === 'accuracy.request_remake') {
        addText(parent, 'approval-reason', 'Request a remake of order ' + args.order_id + '.');
      } else if (Array.isArray(args.changes) && args.changes.every(change => typeof change.available === 'boolean' && change.item_id)) {
        const items = Object.values((proposal.evidence || {}).observations || {}).flatMap(context => (context.menu || {}).items || []);
        args.changes.forEach(change => {
          const item = items.find(item => item.id === change.item_id);
          addText(parent, 'approval-reason', (change.available ? 'Make available: ' : 'Hide from menu: ') +
            (item ? item.name : readable(change.item_id)));
          if (change.reason) addText(parent, 'approval-meta', change.reason);
        });
      } else {
        addText(parent, 'approval-reason', proposal.summary);
        friendlyFields(parent, args);
      }
    }

    function friendlyFields(parent, fields) {
      Object.entries(fields).forEach(([key, value]) => {
        if (value === null || value === undefined) return;
        if (typeof value === 'object') {
          addText(parent, 'approval-label', readable(key));
          if (Array.isArray(value)) value.forEach(item => {
            if (item && typeof item === 'object') friendlyFields(parent, item);
            else addText(parent, 'approval-reason', String(item));
          });
          else friendlyFields(parent, value);
        } else {
          addText(parent, 'approval-reason', readable(key) + ': ' +
            (typeof value === 'boolean' ? (value ? 'Yes' : 'No') : value));
        }
      });
    }

    function technicalDetails(parent, data) {
      const details = document.createElement('details');
      details.className = 'technical-details';
      const summary = document.createElement('summary');
      summary.textContent = 'Technical details';
      const payload = document.createElement('pre');
      payload.className = 'action-arguments';
      payload.textContent = JSON.stringify(data, null, 2);
      details.append(summary, payload);
      parent.appendChild(details);
    }

    refresh.onclick = () => { loadServers(); loadStatus(true); loadAutonomy(); };
    loadServers();
    loadAutonomy();
    setInterval(() => loadStatus(false), 30000);
    setInterval(loadAutonomy, 5000);

    const SUGGESTIONS = [
      "List all suspicious-activity zones",
      "Show anything dropped on the floor and put back in the food area. How often, and which station?",
      "How many high-severity food-safety events are there?",
      "What is our order accuracy rate right now?",
      "How deep is the kiosk queue?"
    ];

    SUGGESTIONS.forEach(text => {
      const b = document.createElement('button');
      b.textContent = text.length > 46 ? text.slice(0, 44) + '…' : text;
      b.title = text;
      b.onclick = () => { q.value = text; q.focus(); };
      quick.appendChild(b);
    });

    function add(role, text, isErr) {
      const el = document.createElement('div');
      el.className = 'msg ' + (role === 'me' ? 'me' : 'bot') + (isErr ? ' err' : '');
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (send.disabled) return;
      const question = q.value.trim();
      if (!question) return;
      add('me', question);
      q.value = '';
      send.disabled = true;
      status.textContent = 'thinking…';
      const pending = add('bot', '');
      pending.innerHTML = '<span class="spin"></span> thinking…';
      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        if (data.ok) {
          pending.textContent = data.answer;
        } else {
          pending.classList.add('err');
          pending.textContent = 'Error: ' + (data.error || 'unknown');
        }
      } catch (err) {
        pending.classList.add('err');
        pending.textContent = 'Request failed: ' + err;
      } finally {
        send.disabled = false;
        status.textContent = 'ready';
        q.focus();
      }
    });

    q.focus();
  </script>
</body>
</html>
